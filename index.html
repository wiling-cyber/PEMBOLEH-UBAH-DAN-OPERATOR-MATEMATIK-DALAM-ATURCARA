<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASK bersama Cikgu Wi - Master Kod Arahan</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.88);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-pink: #ec4899;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      width: 100%;
      max-width: 820px;
      padding: 20px;
      z-index: 10;
      position: relative;
    }

    .banner-container {
      width: 100%;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-bottom: none;
      background: #1e293b;
    }

    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 250px;
      object-fit: cover;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: none;
      border-radius: 0 0 24px 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    h1, h3 {
      font-family: 'Fredoka', sans-serif;
      text-align: center;
    }

    .title-gradient {
      background: linear-gradient(135deg, #38bdf8, #a855f7, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 1.05rem;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #38bdf8;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }

    .btn {
      font-family: 'Fredoka', sans-serif;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.6);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: rgba(15, 23, 42, 0.5);
      padding: 14px 20px;
      border-radius: 16px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .question-box {
      text-align: center;
      margin-bottom: 30px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      padding: 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .question-title {
      font-size: 1.3rem;
      color: #f8fafc;
      font-weight: 700;
      line-height: 1.5;
    }

    .code-block {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: monospace;
      color: #38bdf8;
      display: inline-block;
      margin-top: 6px;
      font-size: 1.15rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    @media (min-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      font-family: 'Nunito', sans-serif;
      padding: 16px 20px;
      border-radius: 16px;
      border: 2px solid transparent;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .option-btn .opt-label {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .option-btn .opt-text {
      flex-grow: 1;
    }

    .opt-0 { background: linear-gradient(135deg, #0284c7, #06b6d4); border-color: #38bdf8; }
    .opt-1 { background: linear-gradient(135deg, #7c3aed, #a855f7); border-color: #c084fc; }
    .opt-2 { background: linear-gradient(135deg, #059669, #10b981); border-color: #34d399; }
    .opt-3 { background: linear-gradient(135deg, #d97706, #f59e0b); border-color: #fbbf24; }

    .option-btn:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .option-btn.correct {
      background: linear-gradient(135deg, #16a34a, #22c55e) !important;
      border-color: #86efac !important;
      animation: pulse 0.5s ease-in-out;
    }

    .option-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #ef4444) !important;
      border-color: #fca5a5 !important;
      opacity: 0.7;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .solution-card {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      border-left: 5px solid var(--accent-pink);
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .solution-card h4 {
      color: #f472b6;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .solution-steps {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .sound-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 100;
      transition: 0.2s;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.6);
      padding: 15px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-card .val {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .stat-card .lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-alert {
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }

    .status-alert.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }

    .status-alert.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <button class="sound-toggle" id="soundBtn" onclick="toggleSound()" title="Togol Bunyi">🔊</button>

  <div class="app-container">

    <!-- Cikgu Wi Image Banner -->
    <div class="banner-container">
      <img src="ASK.jpg" alt="ASK bersama Cikgu Wi Banner" class="banner-img">
    </div>

    <!-- SCREEN 1: START -->
    <div id="startScreen" class="card">
      <h1 class="title-gradient">Master Kod Arahan</h1>
      <p class="subtitle">Asas Sains Komputer (ASK) • Tingkatan 1 Bab 4</p>

      <form id="startForm" onsubmit="startGame(event)">
        <div class="input-group">
          <label for="studentName">Nama Murid</label>
          <input type="text" id="studentName" placeholder="Masukkan nama penuh" required>
        </div>

        <div class="input-group">
          <label for="studentClass">Kelas</label>
          <input type="text" id="studentClass" placeholder="Contoh: 1 Amanah" required>
        </div>

        <button type="submit" class="btn" style="margin-top: 10px;">
          🚀 MULA KUIZ
        </button>
      </form>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="gameScreen" class="card hidden">
      <div class="quiz-header">
        <div class="stat-badge" style="color: #38bdf8;">📌 Soalan <span id="qCurrent">1</span>/10</div>
        <div class="stat-badge" style="color: #f59e0b;">🔥 Streak: <span id="streakCount">0</span></div>
        <div class="stat-badge" style="color: #10b981;">⭐ Markah: <span id="scoreCount">0</span>/100</div>
      </div>

      <div class="question-box">
        <div class="question-title" id="qText"></div>
      </div>

      <div class="options-grid" id="optionsContainer"></div>

      <div id="solutionCard" class="solution-card">
        <h4>💡 Penerangan Cikgu Wi:</h4>
        <div id="solutionContent" class="solution-steps"></div>
        <button class="btn" onclick="nextQuestion()" style="margin-top: 15px; padding: 12px; font-size: 1.1rem;">
          Soalan Seterusnya ➔
        </button>
      </div>
    </div>

    <!-- SCREEN 3: RESULTS -->
    <div id="resultScreen" class="card hidden">
      <h1 class="title-gradient">Tahniah! Keputusan Kuiz</h1>
      <p class="subtitle" id="resultStudentInfo">Murid: - | Kelas: -</p>

      <div class="result-stats">
        <div class="stat-card">
          <div class="val" id="resScore">0/100</div>
          <div class="lbl">Markah</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resAccuracy">0%</div>
          <div class="lbl">Ketepatan</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resTime">0s</div>
          <div class="lbl">Masa Penuh</div>
        </div>
      </div>

      <div id="badgeContainer" style="text-align: center; margin-bottom: 20px;">
        <div id="badgeTitle" style="font-size: 1.5rem; font-weight: 700; color: #f59e0b;">🏆 Legenda Pengaturcaraan</div>
      </div>

      <div id="sheetStatus" class="status-alert"></div>

      <button class="btn" onclick="resetToStart()">
        🔄 Main Semula
      </button>
    </div>

  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEhAjxGLvZAGeMY8NC7c-sHVDGWh5k8shRF3J8Dt0XtiptNUPleGej6P5DyolMU4KX-w/exec";

    // Animated Canvas Background
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const symbols = ['{ }', '0101', 'True', 'False', '+', '*', '/', 'int', 'String', '</>'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class MathParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 18 + 14;
        this.text = symbols[Math.floor(Math.random() * symbols.length)];
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.alpha = Math.random() * 0.3 + 0.1;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.02;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot;
        if (this.x < -50 || this.x > canvas.width + 50 || this.y < -50 || this.y > canvas.height + 50) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = `rgba(236, 72, 153, ${this.alpha})`;
        ctx.font = `${this.size}px Fredoka, sans-serif`;
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) particles.push(new MathParticle());
    function animateBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    // Audio Synthesizer
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function playCheerSound() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.4);
      });
    }

    function playSirenSound() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.linearRampToValueAtTime(180, now + 0.25);
      osc.frequency.linearRampToValueAtTime(400, now + 0.45);
      osc.frequency.linearRampToValueAtTime(150, now + 0.7);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.75);
    }

    // Questions Bank
    const questionsBank = [
      {
        question: "Apakah maksud pemboleh ubah dalam pengaturcaraan?",
        options: [
          "Simbol yang digunakan untuk operasi matematik",
          "Storan ingatan yang digunakan untuk menyimpan data yang akan diolah",
          "Program komputer yang digunakan untuk menaip kod arahan",
          "Keputusan akhir yang dipaparkan pada skrin komputer"
        ],
        correct: 1,
        solution: "Pemboleh ubah ialah storan ingatan yang digunakan oleh program komputer untuk menyimpan data yang akan diolah."
      },
      {
        question: "Antara berikut, jenis data manakah yang TERDIRI daripada nombor integer dan nombor perpuluhan?",
        options: [
          "Teks",
          "Nilai Logik",
          "Nilai Berangka",
          "Boolean"
        ],
        correct: 2,
        solution: "Nilai Berangka mengandungi nombor integer (seperti 0, 1, 2) dan nombor perpuluhan."
      },
      {
        question: "Data jenis Teks terdiri daripada:",
        options: [
          "Nombor integer sahaja",
          "Nilai True dan False",
          "Satu abjad atau beberapa abjad",
          "Simbol-simbol matematik sahaja"
        ],
        correct: 2,
        solution: "Data Teks terdiri daripada satu abjad atau beberapa abjad."
      },
      {
        question: "Nilai Logik dalam pengaturcaraan juga dikenali sebagai:",
        options: [
          "Integer",
          "Boolean",
          "Float",
          "String"
        ],
        correct: 1,
        solution: "Nilai Logik dikenali sebagai Boolean."
      },
      {
        question: "Antara berikut, perkataan apakah yang digunakan dalam jenis data Nilai Logik?",
        options: [
          "Yes dan No",
          "True dan False",
          "On dan Off",
          "High dan Low"
        ],
        correct: 1,
        solution: "Nilai Logik (Boolean) menggunakan perkataan True dan False."
      },
      {
        question: "Apakah fungsi utama operator matematik dalam kod arahan?",
        options: [
          "Menyimpan data ke dalam storan ingatan",
          "Simbol-simbol yang digunakan untuk menjalankan operasi matematik",
          "Memasukkan teks ke dalam komputer",
          "Menukar nilai True kepada False"
        ],
        correct: 1,
        solution: "Operator matematik ialah simbol-simbol yang digunakan dalam menjalankan operasi matematik dalam kod arahan."
      },
      {
        question: "Antara berikut, apakah simbol yang digunakan oleh komputer untuk operasi 'Darab'?",
        options: [
          "×",
          "*",
          "/",
          "+"
        ],
        correct: 1,
        solution: "Dalam sistem komputer, operasi Darab diwakili oleh simbol asterisk (*)."
      },
      {
        question: "Apakah simbol bagi operator 'Bahagi' di dalam sistem komputer?",
        options: [
          "÷",
          "*",
          "/",
          "-"
        ],
        correct: 2,
        solution: "Dalam sistem komputer, operasi Bahagi diwakili oleh simbol garis condong (/)."
      },
      {
        question: "Berapakah output bagi kod arahan berikut?<br><span class='code-block'>hasil = 5 * 4 + 3</span>",
        options: [
          "35",
          "23",
          "20",
          "27"
        ],
        correct: 1,
        solution: "Komputer mengira pendaraban (*) terlebih dahulu: (5 * 4 = 20), kemudian penambahan (+ 3). Hasilnya 20 + 3 = <b>23</b>."
      },
      {
        question: "Diberi <span class='code-block'>a = 15</span> dan <span class='code-block'>b = 3</span>. Cari output bagi kod arahan:<br><span class='code-block'>print(a / b + 2)</span>",
        options: [
          "7",
          "5",
          "3",
          "10"
        ],
        correct: 0,
        solution: "1) Simbol '/' bermaksud bahagi: 15 / 3 = 5.<br>2) Kemudian 5 + 2 = <b>7</b>."
      }
    ];

    // Gameplay Logic
    let currentQ = 0;
    let score = 0;
    let streak = 0;
    let correctAnswers = 0;
    let totalTimeSpent = 0;
    let gameStartTime = 0;

    let studentData = { nama: '', kelas: '' };

    function startGame(e) {
      e.preventDefault();
      studentData.nama = document.getElementById('studentName').value.trim();
      studentData.kelas = document.getElementById('studentClass').value.trim();

      if (!studentData.nama || !studentData.kelas) return;

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      currentQ = 0;
      score = 0;
      streak = 0;
      correctAnswers = 0;
      totalTimeSpent = 0;
      gameStartTime = Date.now();

      loadQuestion();
    }

    function loadQuestion() {
      if (currentQ >= questionsBank.length) {
        endGame();
        return;
      }

      const q = questionsBank[currentQ];
      document.getElementById('qCurrent').textContent = currentQ + 1;
      document.getElementById('streakCount').textContent = streak;
      document.getElementById('scoreCount').textContent = score;

      document.getElementById('qText').innerHTML = q.question;

      const optionsDiv = document.getElementById('optionsContainer');
      optionsDiv.innerHTML = '';
      document.getElementById('solutionCard').style.display = 'none';

      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `option-btn opt-${idx}`;
        btn.onclick = () => checkAnswer(idx);
        btn.innerHTML = `
          <div class="opt-label">${labels[idx]}</div>
          <div class="opt-text">${opt}</div>
        `;
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx) {
      const q = questionsBank[currentQ];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.style.pointerEvents = 'none');

      if (selectedIdx === q.correct) {
        playCheerSound();
        if (selectedIdx >= 0) buttons[selectedIdx].classList.add('correct');
        streak++;
        correctAnswers++;
        score += 10;
      } else {
        playSirenSound();
        if (selectedIdx >= 0) buttons[selectedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        streak = 0;
      }

      document.getElementById('scoreCount').textContent = score;
      document.getElementById('streakCount').textContent = streak;

      document.getElementById('solutionContent').innerHTML = q.solution;
      document.getElementById('solutionCard').style.display = 'block';
    }

    function nextQuestion() {
      currentQ++;
      loadQuestion();
    }

    function endGame() {
      totalTimeSpent = Math.round((Date.now() - gameStartTime) / 1000);
      const accuracy = Math.round((correctAnswers / questionsBank.length) * 100);

      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      document.getElementById('resultStudentInfo').textContent = `Murid: ${studentData.nama} | Kelas: ${studentData.kelas}`;
      document.getElementById('resScore').textContent = `${score}/100`;
      document.getElementById('resAccuracy').textContent = `${accuracy}%`;
      document.getElementById('resTime').textContent = `${totalTimeSpent}s`;

      let badge = "🥇 Pakar Kod Arahan";
      if (accuracy < 50) badge = "🌱 Pemula Kod Arahan";
      else if (accuracy < 80) badge = "⭐ Pengaturcara Muda";
      document.getElementById('badgeTitle').textContent = badge;

      sendToGoogleSheet(accuracy);
    }

    function sendToGoogleSheet(accuracy) {
      const statusDiv = document.getElementById('sheetStatus');
      
      statusDiv.className = 'status-alert';
      statusDiv.style.display = 'block';
      statusDiv.style.background = 'rgba(56, 189, 248, 0.2)';
      statusDiv.style.borderColor = '#38bdf8';
      statusDiv.style.color = '#7dd3fc';
      statusDiv.textContent = '⏳ Menghantar markah ke Google Sheet Cikgu Wi...';

      const payload = {
        nama: studentData.nama,
        kelas: studentData.kelas,
        markah: `${score}/100`,
        peratus: `${accuracy}%`,
        masa: `${totalTimeSpent}s`
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'status-alert success';
        statusDiv.textContent = '✅ Markah berjaya disimpan terus ke Google Sheet Cikgu Wi!';
      })
      .catch(err => {
        console.error(err);
        statusDiv.className = 'status-alert error';
        statusDiv.textContent = '❌ Ralat penghantaran data. Sila semak sambungan internet.';
      });
    }

    function resetToStart() {
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }
  </script>
</body>
</html>
